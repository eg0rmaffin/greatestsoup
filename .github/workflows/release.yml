name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gradle itself runs on Java 25, the mod is compiled with a Java 8 toolchain it downloads
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Check that the tag matches mod_version
        run: |
          version=$(sed -n 's/^mod_version *= *//p' gradle.properties)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mod_version $version in gradle.properties"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew build

      - name: Upload to CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: ./gradlew curseforge

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The section of CHANGELOG.md between "## [$VERSION]" and the next version header
          awk -v header="## [$VERSION]" 'index($0, "## [") == 1 { p = index($0, header) == 1; next } p' CHANGELOG.md \
            > release-notes.md
          gh release create "$GITHUB_REF_NAME" "build/libs/greatestsoup-$VERSION.jar" \
            --title "The Greatest Soup $VERSION" --notes-file release-notes.md
