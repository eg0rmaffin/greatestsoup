# Corail Tombstone 4.8.0 ships these lines in META-INF/tombstone_at.cfg but doesn't declare the file in its manifest,
# so Forge never applies them and Tombstone crashes with IllegalAccessError when a mob targets a player under Ghostly
# Shape. Copied verbatim so they're applied through this mod's manifest instead.
public net.minecraft.entity.EntityLiving field_70696_bz # attackTarget
public net.minecraft.entity.EntityLivingBase field_70755_b # revengeTarget
public net.minecraft.entity.EntityLivingBase field_70756_c # revengeTimer
public net.minecraft.entity.EntityLivingBase field_184617_aD # ticksSinceLastSwing
